<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ESA ✦ Teman Belajar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-idle" id="appBody">

  <div class="sparkles"></div>

  <div class="app-window">
    <div class="title-bar">
      <span class="title-text">✦ ESA.exe ✦</span>
      <div class="title-dots">
        <span class="dot dot-yellow"></span>
        <span class="dot dot-mint"></span>
        <span class="dot dot-pink"></span>
      </div>
    </div>

    <!-- STAGE ROBOT: besar+tengah di awal, kecil+atas setelah ada percakapan -->
    <div class="robot-stage" id="robotStage">
      <div class="robot" id="esa">
        <div class="antenna">
          <div class="antenna-stick"></div>
          <div class="antenna-ball"></div>
        </div>

        <div class="head">
          <div class="eye eye-left"><div class="pupil"></div></div>
          <div class="eye eye-right"><div class="pupil"></div></div>
          <div class="mouth" id="mouth"></div>
          <div class="cheek cheek-left"></div>
          <div class="cheek cheek-right"></div>
        </div>

        <div class="body">
          <div class="arm arm-left">
            <div class="hand">
              <div class="finger f1"></div>
              <div class="finger f2"></div>
              <div class="finger f3"></div>
            </div>
          </div>
          <div class="arm arm-right">
            <div class="hand">
              <div class="finger f1"></div>
              <div class="finger f2"></div>
              <div class="finger f3"></div>
            </div>
          </div>
          <div class="panel-light"></div>
        </div>

        <div class="feet">
          <div class="foot">
            <div class="toe t1"></div>
            <div class="toe t2"></div>
            <div class="toe t3"></div>
          </div>
          <div class="foot">
            <div class="toe t1"></div>
            <div class="toe t2"></div>
            <div class="toe t3"></div>
          </div>
        </div>
      </div>

      <p class="status-text" id="statusText">Sistem Esa: aktif ✦</p>
    </div>

    <!-- SAPAAN AWAL (cuma keliatan sebelum ada percakapan) -->
    <div class="idle-greeting">
      <p>Hai! Aku Esa ✦ Tanya aku apa saja, ya!</p>
    </div>

    <!-- RIWAYAT PERCAKAPAN (muncul begitu mulai nanya) -->
    <div class="message-log" id="messageLog">
      <div class="msg msg-esa">
        <p>Hai! Aku Esa ✦ Tanya aku apa saja, ya!</p>
      </div>
    </div>

    <!-- BAR BAWAH: INPUT + MIC (selalu ada) -->
    <div class="bottom-bar">
      <form class="text-row" id="textForm">
        <input type="text" id="textInput" class="text-input" placeholder="Tulis pertanyaan di sini..." autocomplete="off">
        <button type="submit" class="btn btn-send">Kirim</button>
      </form>
      <button class="btn btn-mic" id="micBtn" type="button">🎤 Tanya Esa</button>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
